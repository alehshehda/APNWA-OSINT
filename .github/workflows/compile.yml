name: Build and Release PDF

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: main.tex
          args: -pdf -bibtex -interaction=nonstopmode -halt-on-error

      - name: Rename and verify PDF
        run: |
          mv main.pdf APNWA-OSINT.pdf
          test -s APNWA-OSINT.pdf

      - name: Prepare GitHub Pages site
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p _site
          cp APNWA-OSINT.pdf _site/
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=APNWA-OSINT.pdf">
            <title>APNWA-OSINT - PDF</title>
          </head>
          <body>
            <p>Redirecting to <a href="APNWA-OSINT.pdf">APNWA-OSINT.pdf</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Upload PDF artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-pdf
          path: APNWA-OSINT.pdf
          retention-days: 7

  deploy_pages:
    needs: build_latex
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  release:
    needs: build_latex
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-pdf

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset latest "$asset" --yes --repo "$REPO"
            done < <(gh release view latest --repo "$REPO" --json assets --jq '.assets[].name | select(endswith(".pdf") and . != "APNWA-OSINT.pdf")')
            gh release upload latest APNWA-OSINT.pdf --clobber --repo "$REPO"
          else
            gh release create latest APNWA-OSINT.pdf --target "$GITHUB_SHA" --title "Latest Compiled PDF" --notes "Automated LaTeX build." --repo "$REPO"
          fi
